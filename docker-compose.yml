services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rnghelpdesk_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rnghelpdesk_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rnghelpdesk_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - rnghelpdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rnghelpdesk-postgres-data:
